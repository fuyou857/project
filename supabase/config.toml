# Supabase CLI 本地配置（与 Dashboard 项目 ref 一致）
# 用于：`supabase link` / `supabase functions deploy …`
project_id = "wlkrdylgojkhgfzvcagc"

# 用户名密码登录入口：调用方无 JWT，部署时须关闭校验（与 CLI --no-verify-jwt 等价）
[functions.login]
verify_jwt = false

# ONLYOFFICE 文档服务器 POST 保存回调，无 Supabase 用户 JWT
[functions.onlyoffice-callback]
verify_jwt = false

# 扫码登录入口无 JWT；绑定类 action 在函数内校验 Bearer
[functions.wechat-work-auth]
verify_jwt = false

# 管理员用户操作：函数内自行校验 super_admin JWT
[functions.admin-user-ops]
verify_jwt = false

# API 密钥中心：函数内校验权限
[functions.api-key-ops]
verify_jwt = false
