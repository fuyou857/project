<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONLYOFFICE 极简测试</title>
    <style>
        body {
            margin: 20px;
            font-family: Arial, sans-serif;
        }
        #editor {
            width: 100%;
            height: 600px;
            border: 1px solid #ccc;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
        }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>ONLYOFFICE 极简测试</h1>
    <div class="status info">正在加载编辑器...</div>
    
    <!-- ONLYOFFICE编辑器容器 -->
    <div id="editor"></div>

    <!-- 只加载ONLYOFFICE API，不加载任何应用JS -->
    <script src="https://office.ciond.com/web-apps/apps/api/documents/api.js"></script>
    
    <script>
        // 简化的编辑器初始化
        window.addEventListener('DOMContentLoaded', function() {
            console.log('页面加载完成，开始初始化编辑器');
            
            // 检查API是否加载
            if (typeof DocsAPI === 'undefined') {
                document.querySelector('.status').textContent = 'ERROR: ONLYOFFICE API未加载';
                document.querySelector('.status').className = 'status error';
                console.error('ONLYOFFICE API未加载');
                return;
            }
            
            console.log('ONLYOFFICE API加载成功');
            
            // 配置编辑器
            const config = {
                width: '100%',
                height: '100%',
                type: 'desktop',
                documentType: 'pdf',
                document: {
                    title: '测试文档.pdf',
                    url: 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf',
                    fileType: 'pdf',
                    key: 'simple-test-' + Date.now(),
                    permissions: {
                        view: true,
                        edit: false
                    }
                },
                editorConfig: {
                    lang: 'zh-CN',
                    mode: 'view',
                    user: {
                        id: 'test',
                        name: '测试用户'
                    }
                },
                events: {
                    onReady: function() {
                        document.querySelector('.status').textContent = '编辑器准备就绪';
                        document.querySelector('.status').className = 'status success';
                        console.log('编辑器准备就绪');
                    },
                    onDocumentReady: function() {
                        document.querySelector('.status').textContent = '文档加载完成';
                        document.querySelector('.status').className = 'status success';
                        console.log('文档加载完成');
                    },
                    onError: function(error) {
                        const errorMsg = `错误: ${error.data.errorDescription}`;
                        document.querySelector('.status').textContent = errorMsg;
                        document.querySelector('.status').className = 'status error';
                        console.error('编辑器错误:', error);
                    }
                }
            };
            
            console.log('编辑器配置:', config);
            
            // 初始化编辑器
            try {
                const editor = new DocsAPI.DocEditor('editor', config);
                console.log('编辑器实例创建成功');
            } catch (e) {
                document.querySelector('.status').textContent = '初始化失败: ' + e.message;
                document.querySelector('.status').className = 'status error';
                console.error('初始化失败:', e);
            }
        });
    </script>
</body>
</html>
