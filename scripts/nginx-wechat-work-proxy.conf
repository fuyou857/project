# 企业微信 API 固定 IP 中转（本机 wechat-work-proxy-server.mjs，默认 8790）
# 宝塔 include 示例：
#   /www/server/panel/vhost/nginx/extension/www.ciond.com/wechat-work-proxy.conf
#
# Edge / 密钥中心配置：
#   WECHAT_WORK_PROXY_URL=https://www.ciond.com/api/wechat-work-proxy
#   WECHAT_WORK_PROXY_SECRET=与服务器 .env 中相同
#
# 企微应用 → 企业可信 IP：填本站公网出口 IP（curl -s ifconfig.me）

location /api/wechat-work-proxy/ {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "content-type, x-wechat-proxy-secret" always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
    }
    rewrite ^/api/wechat-work-proxy/(.*) /$1 break;
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Wechat-Proxy-Secret $http_x_wechat_proxy_secret;
    # 不向企微上游传递客户端 IP（由 Node 代理以本站固定出口 8.148.26.47 访问 qyapi）
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}
