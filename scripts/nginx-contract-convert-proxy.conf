# 宝塔 / Nginx：放入站点 include 目录后 reload，使 Supabase 云端 Edge 能访问本机 contract-convert 容器。
#
# 宝塔路径示例（与 www.ciond.com.conf 中的 include 一致）：
#   /www/server/panel/vhost/nginx/extension/www.ciond.com/contract-convert-proxy.conf
#
# Supabase Dashboard → Edge Functions → contract-document-convert → Secrets：
#   DOC_CONVERT_SERVICE_BASE_URL = https://www.ciond.com/api/contract-convert
#   DOC_CONVERT_WEBHOOK_SECRET   = 与 docker-compose 中 CONTRACT_CONVERT_SECRET 相同
#
# 确保本机已：docker compose up -d contract-convert（监听 127.0.0.1:8788）

location /api/contract-convert/ {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "authorization, x-client-info, apikey, content-type, x-contract-convert-secret" always;
        add_header Access-Control-Max-Age 86400 always;
        return 204;
    }
    rewrite ^/api/contract-convert/(.*) /$1 break;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}
