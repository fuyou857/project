# 企业微信域名校验 — 部署说明
#
# 1) 将 HTTP 专用 server 放到宝塔 vhost（不会被「网站设置」覆盖）：
#    cp scripts/00.ciond-wechat-verify-http.conf.example \
#       /www/server/panel/vhost/nginx/00.ciond-wechat-verify-http.conf
#
# 2) www.ciond.com.conf 的 server 块应 ONLY listen 443，不要在同一文件里写：
#    if ($server_port = 80) { return 301 https://...; }
#
# 3) 校验文件内容（企微官方）：仅 WW_verify_ 后面的字符串，例如：
#    文件名 WW_verify_Kab2AzoP9HWQUQVH.txt → 内容一行：Kab2AzoP9HWQUQVH
#
# 4) 用 curl 自测（不要用已开过 HTTPS 的浏览器测 http，会被 HSTS 自动跳 https）：
#    curl -sI http://www.ciond.com/WW_verify_Kab2AzoP9HWQUQVH.txt
#    预期：HTTP/1.1 200，无 Location 头，body 为 Kab2AzoP9HWQUQVH
