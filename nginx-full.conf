server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name www.ciond.com ciond.com;
    index index.html index.htm;
    root /www/wwwroot/ciond/dist;
    include /www/server/panel/vhost/nginx/extension/www.ciond.com/*.conf;

    ssl_certificate    /www/server/panel/vhost/cert/www.ciond.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/www.ciond.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    resolver 223.5.5.5 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    location /sb-api/ {
        rewrite ^/sb-api/(.*)$ /$1 break;
        proxy_pass https://wlkrdylgojkhgfzvcagc.supabase.co;
        proxy_set_header Host wlkrdylgojkhgfzvcagc.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header apikey $http_apikey;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header x-client-info $http_x_client_info;
    }

    location /sb-api/storage/v1/ {
        proxy_pass https://wlkrdylgojkhgfzvcagc.supabase.co/storage/v1/;
        proxy_set_header Host wlkrdylgojkhgfzvcagc.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header apikey $http_apikey;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header x-client-info $http_x_client_info;
    }

    location /supabase/functions/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "authorization, x-client-info, apikey, content-type" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        
        # 优先使用本地运行的 contract-document-convert 服务
        rewrite ^/supabase/functions/v1/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header apikey $http_apikey;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
        
        # 如果本地服务失败，可以回退到 Supabase 云端（可选）
        # proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    }

    # 本地 contract-convert 服务的反向代理（用于 Edge Functions 调用）
    location /api/contract-convert/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "authorization, x-client-info, apikey, content-type, x-contract-convert-secret" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        rewrite ^/api/contract-convert/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
    }

    include /www/wwwroot/ciond/scripts/nginx-onlyoffice-callback-snippet.conf;
    include /www/server/panel/vhost/nginx/extension/www.ciond.com/wechat-work-domain-verify.conf;

    # 企业微信校验文件：直接返回，不被 SPA 路由拦截
    location ~ ^/WW_verify_.*\.txt$ {
        try_files $uri =404;
        add_header Content-Type text/plain;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$ {
        expires -1;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log  /www/wwwlogs/www.ciond.com.log;
    error_log  /www/wwwlogs/www.ciond.com.error.log;
}
