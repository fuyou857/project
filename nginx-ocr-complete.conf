# ocr.ciond.com 完整Nginx配置文件
# 已按照要求优化：增加超时设置、文件大小限制，移除重复CORS头
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name ocr.ciond.com;
    root /www/wwwroot/ciond/api/orc;

    # SSL 申请验证
    include /www/server/panel/vhost/nginx/well-known/ocr.ciond.com.conf;
    include /www/server/panel/vhost/nginx/extension/ocr.ciond.com/*.conf;
    
    # 强制 HTTPS
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ( $uri ~ /\.well-known/ ) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }

    # SSL 证书
    ssl_certificate    /www/server/panel/vhost/cert/ocr.ciond.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/ocr.ciond.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000";

    # 🔥 关键：反向代理到 Python OCR 8810 端口
    # 已按要求设置超时时间和文件大小限制
    location / {
        proxy_pass http://127.0.0.1:8810;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 文件大小限制：支持最大12MB的发票上传
        client_max_body_size 12m;
        
        # 超时设置：适应OCR识别的长时间处理
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
    }

    # 静态缓存
    location ~ .*\.(gif|jpg|jpeg|png|js|css)$ {
        expires 12h;
        access_log off;
    }

    # 安全规则
    location ~* /(\.git|\.svn|\.env|vendor|node_modules) {
        return 404;
    }

    location ~ \.well-known{
        allow all;
    }

    access_log  /www/wwwlogs/ocr.ciond.com.log;
    error_log   /www/wwwlogs/ocr.ciond.com.error.log;
}