server:
  port: 8080

spring:
  application:
    name: contract-template-system

  datasource:
    url: jdbc:h2:file:./example_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

file:
  upload-dir: ./uploads
  template-dir: ./templates
  contract-dir: ./contracts

logging:
  level:
    com.example.contract.template: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG